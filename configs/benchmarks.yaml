# Cấu hình thực nghiệm cho các mô hình thống kê đối chứng M5
data_dir: data/raw
results_dir: results/benchmarks
horizon: 28
seasonality: 7
validation_origin: 1885
test_origin: 1913
models:
  seasonal_naive:
    seasonality: 7
  exponential_smoothing:
    alpha: 0.2
    gamma: 0.15
    seasonality: 7
    aggregation: bottom_up
  croston:
    alpha: 0.1
  croston_sba:
    alpha: 0.1
stores:
  - CA_1
  - CA_2
  - CA_3
  - CA_4
  - TX_1
  - TX_2
  - TX_3
  - WI_1
  - WI_2
  - WI_3
categories:
  - FOODS
  - HOBBIES
  - HOUSEHOLD
